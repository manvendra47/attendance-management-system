<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Attendance Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <h1>Attendance Management</h1>
        <p class="subtitle">Sign in to continue</p>

        <div class="alert alert-error" th:if="${param.error}">Invalid username or password.</div>
        <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn" style="width:100%;">Sign In</button>
        </form>

        <div class="demo-creds">
            <strong>Demo accounts</strong><br>
            Admin: admin / admin123<br>
            Faculty: asmith / faculty123<br>
            Student: jdoe / student123
        </div>
    </div>
</div>
</body>
</html>
