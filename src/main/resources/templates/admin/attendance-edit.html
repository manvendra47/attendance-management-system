<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Attendance</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: adminNav}"></div>

<div class="container">
    <h1>Edit Attendance Record</h1>
    <p style="color:#6b7280;">
        User: <strong th:text="${record.user.fullName}"></strong>
    </p>

    <div class="card" style="max-width:500px;">
        <form th:action="@{/admin/attendance/{id}(id=${record.id})}" method="post">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" th:value="${record.date}" required>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                            th:selected="${s == record.status}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="remarks">Remarks</label>
                <textarea id="remarks" name="remarks" rows="2" th:text="${record.remarks}"></textarea>
            </div>
            <div class="actions">
                <button type="submit" class="btn">Update Record</button>
                <a class="btn btn-secondary" th:href="@{/admin/attendance}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
