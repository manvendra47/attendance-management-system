<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: adminNav}"></div>

<div class="container">
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="page-header">
        <h1>Manage Users</h1>
        <a class="btn" th:href="@{/admin/users/new}">+ Add User</a>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.fullName}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${user.role.name() == 'ADMIN'} ? 'badge-admin' : (${user.role.name() == 'FACULTY'} ? 'badge-faculty' : 'badge-student')"
                          th:text="${user.role}"></span>
                </td>
                <td th:text="${user.enabled} ? 'Active' : 'Disabled'"></td>
                <td class="actions">
                    <a class="btn btn-sm btn-secondary" th:href="@{/admin/users/{id}/edit(id=${user.id})}">Edit</a>
                    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post"
                          onsubmit="return confirm('Delete this user and all their attendance records?');">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
