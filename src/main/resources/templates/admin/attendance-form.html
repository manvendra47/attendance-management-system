<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mark Attendance</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: adminNav}"></div>

<div class="container">
    <h1>Mark Attendance</h1>

    <div class="card" style="max-width:500px;">
        <form th:action="@{/admin/attendance}" method="post">
            <div class="form-group">
                <label for="userId">User</label>
                <select id="userId" name="userId" required>
                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName} + ' (' + ${u.role} + ')'"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" th:value="${today}" required>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="remarks">Remarks (optional)</label>
                <textarea id="remarks" name="remarks" rows="2"></textarea>
            </div>
            <div class="actions">
                <button type="submit" class="btn">Save Record</button>
                <a class="btn btn-secondary" th:href="@{/admin/attendance}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
